name: CD

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      run_release:
        description: "Run semantic release job"
        required: false
        default: true
        type: boolean
      deploy_pages:
        description: "Render paper HTML and deploy GitHub Pages site"
        required: false
        default: true
        type: boolean

env:
# Release lane: dispatch-only (release_type=beta|stable); push never releases.
  RELEASE_TYPE: ${{ inputs.release_type }}

permissions: {}

# ci-policy: allow concurrency reason: serialize releases and pages deploys, never cancel one mid-publish
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.run_release }}
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout as the CI GitHub App (admin role) so PSR can push the
          # version bump + tag past the main branch ruleset (PR + CodeQL rules).
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: n24q02m/better-semantic-release@a73de1a9b877fead3dcb0d5eca6b33bb4fe7d3b5 # v1.14.1
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta

      - uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

  pages-build:
    if: ${{ inputs.deploy_pages }}
    name: Build Paper & Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The reading copy is GENERATED from paper/main.tex, never hand-written, so
      # it cannot drift from the source the Zenodo deposit is built from.
      - name: Install LaTeXML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexml poppler-utils

      # The figures are matplotlib PDFs, and \includegraphics names them WITH
      # the .pdf extension, so LaTeXML resolves the file it was pointed at,
      # cannot use a PDF as a web image, and emits <img src=""> with
      # ltx_missing_image. Rasterise each one, then render from a COPY of the
      # source whose figure paths carry .png. The copy is what makes this safe:
      # paper/main.tex is untouched, so the PDF build and the deposit are
      # unaffected and the HTML still comes from the same source.
      - name: Rasterise the figures
        run: |
          shopt -s nullglob
          count=0
          for pdf in paper/figures/*.pdf; do
            pdftocairo -png -r 200 -singlefile "$pdf" "${pdf%.pdf}"
            count=$((count + 1))
          done
          echo "rasterised $count figure(s)"
          test "$count" -gt 0
          ls -la paper/figures/*.png

      - name: Render the paper to HTML
        run: |
          cp -r paper paper-html
          sed -i 's|{figures/\([^}]*\)\.pdf}|{figures/\1.png}|g' paper-html/main.tex
          remaining=$(grep -c 'figures/[^}]*\.pdf' paper-html/main.tex || true)
          echo "figure references still pointing at a PDF: $remaining"
          test "$remaining" -eq 0
          mkdir -p site/public/paper
          cd paper-html
          latexmlc main.tex \
            --format=html5 \
            --svg \
            --dest=../site/public/paper/index.html
          test -s ../site/public/paper/index.html

      # An empty src is how the missing-figure bug showed up the first time, so
      # fail the build on it rather than deploying a paper with blank figures.
      - name: Check every figure resolved
        run: |
          if grep -q '<img src=""' site/public/paper/index.html; then
            echo "::error::LaTeXML emitted an empty image src -- a figure did not resolve"
            grep -o '<img src=""[^>]*>' site/public/paper/index.html | head
            exit 1
          fi
          echo "figures referenced: $(grep -c '<img ' site/public/paper/index.html)"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Build the site
        working-directory: site
        run: |
          bun install
          bun run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
          retention-days: 3

  pages-deploy:
    needs: pages-build
    if: ${{ inputs.deploy_pages }}
    name: Deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-telemetry: true

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
