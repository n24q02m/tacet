name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable

env:
# Release lane: merge to main auto-publishes stable; beta only via manual dispatch (release_type=beta).
  RELEASE_TYPE: ${{ github.event_name == 'push' && 'stable' || inputs.release_type }}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout as the CI GitHub App (admin role) so PSR can push the
          # version bump + tag past the main branch ruleset (PR + CodeQL rules).
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: n24q02m/better-semantic-release@4bab853128d17c7d8d0173c79883624e77a3ead6 # v1.12.0
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta

      - uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
