name: pages

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The reading copy is GENERATED from paper/main.tex, never hand-written, so
      # it cannot drift from the source the Zenodo deposit is built from.
      - name: Install LaTeXML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexml poppler-utils

      # The figures are matplotlib PDFs, and \includegraphics names them WITH
      # the .pdf extension, so LaTeXML resolves the file it was pointed at,
      # cannot use a PDF as a web image, and emits <img src=""> with
      # ltx_missing_image. Rasterise each one, then render from a COPY of the
      # source whose figure paths carry .png. The copy is what makes this safe:
      # paper/main.tex is untouched, so the PDF build and the deposit are
      # unaffected and the HTML still comes from the same source.
      - name: Rasterise the figures
        run: |
          shopt -s nullglob
          count=0
          for pdf in paper/figures/*.pdf; do
            pdftocairo -png -r 200 -singlefile "$pdf" "${pdf%.pdf}"
            count=$((count + 1))
          done
          echo "rasterised $count figure(s)"
          test "$count" -gt 0
          ls -la paper/figures/*.png

      - name: Render the paper to HTML
        run: |
          cp -r paper paper-html
          sed -i 's|{figures/\([^}]*\)\.pdf}|{figures/\1.png}|g' paper-html/main.tex
          remaining=$(grep -c 'figures/[^}]*\.pdf' paper-html/main.tex || true)
          echo "figure references still pointing at a PDF: $remaining"
          test "$remaining" -eq 0
          mkdir -p site/public/paper
          cd paper-html
          latexmlc main.tex \
            --format=html5 \
            --svg \
            --dest=../site/public/paper/index.html
          test -s ../site/public/paper/index.html

      # An empty src is how the missing-figure bug showed up the first time, so
      # fail the build on it rather than deploying a paper with blank figures.
      - name: Check every figure resolved
        run: |
          if grep -q '<img src=""' site/public/paper/index.html; then
            echo "::error::LaTeXML emitted an empty image src -- a figure did not resolve"
            grep -o '<img src=""[^>]*>' site/public/paper/index.html | head
            exit 1
          fi
          echo "figures referenced: $(grep -c '<img ' site/public/paper/index.html)"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build the site
        working-directory: site
        run: |
          bun install
          bun run build

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
