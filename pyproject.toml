[project]
name = "tacet"
version = "1.8.16"
description = "TACET: a self-distilling neuro-symbolic cascade that amortises LLM cost in knowledge-graph QA, with auditable Datalog proof trees"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nguyen Quang Minh", email = "quangminh2402.dev@gmail.com" }]
keywords = ["neuro-symbolic", "knowledge-graph", "datalog", "proof-trees", "auditable-ai", "rule-distillation", "llm-cascade", "cost-amortization", "kgqa", "llm"]
dependencies = [
    "numpy>=1.26.4",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.10.9", "polars>=1.0.0", "scipy>=1.17.1", "pyarrow>=21.0.0", "structlog>=25.1.0"]
torch = ["torch>=2.13.0"]
llm = ["google-genai>=1.75.0", "httpx>=0.28.1", "openai>=1.109.1"]
# all-MiniLM-L6-v2 retrieval for NL strategy baselines; pulled in only for that experiment.
nlbaseline = ["sentence-transformers>=3.0.0"]
all = ["tacet[experiments,torch,llm,nlbaseline]"]
dev = ["pytest>=9.0.3", "pytest-cov>=6.0.0", "ruff>=0.15.14"]

[project.scripts]
tacet = "tacet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tacet"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# experiment runners pin BLAS threads via os.environ before importing numpy.
"src/tacet/eval/experiment.py" = ["E402"]
# kge.py uses upper-case names for batched index arrays (H, T, R), matching
# the mathematical notation in the ComplEx derivation.
"src/tacet/kge/kge.py" = ["N806"]
"src/tacet/kge/kge_torch.py" = ["N806", "E402"]
"src/tacet/eval/benchmark.py" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests that load heavy ML models or take >2s",
    "gpu: marks tests that require CUDA GPU hardware",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = ""
commit_message = "chore(release): {version}"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
